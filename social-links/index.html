<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Profile | Frontend Challenges</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="links-box">
        <img src="./jessica.jpeg" class="photo" alt="photo">
        <div class="top-text">
        <p class="name">Jessica Randall</p>
        <p class="city">London, United Kindgom</p>
        <p class="about">"Front-end developer and avid reader."</p>
        </div>
        <div class="links">
            
            <div class="boxOne">GitHub</div>
            <div class="boxTwo">Frontend Mentor</div>
            <div class="boxThree">Linkedin</div>
            <div class="boxFour">Twitter</div>
            <div class="boxFive">Instagram</div>

        </div>
    </div>
   
    
</body>
</html>
